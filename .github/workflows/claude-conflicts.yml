name: Claude merge conflicts

# After every push to main, Claude's open pull requests (claude/ branches)
# that now conflict with it get the conflicts resolved.

on:
  push:
    branches: [main]

jobs:
  conflicts:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: reaptor/claude-agents/.github/workflows/conflicts.yml@main
    with:
      instructions: .github/claude/arnold.md
      setup: .github/claude/setup.sh
      include-comments-by-actor: klofberg,claude[bot],github-actions[bot]
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
