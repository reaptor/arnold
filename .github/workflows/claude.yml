name: Claude

# The issue agent: an issue labeled `claude` becomes a pull request, and a
# comment or review that mentions `@claude` is acted on. Runs on GitHub's
# runners with the Claude Max subscription; the logic is in
# reaptor/claude-agents (issue-agent.yml) and .github/claude/arnold.md.
# The repo is public: only people with write access can start a run, and only
# their comments (and Claude's and the review workflows') reach Claude.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: reaptor/claude-agents/.github/workflows/issue-agent.yml@main
    with:
      instructions: .github/claude/arnold.md
      setup: .github/claude/setup.sh
      include-comments-by-actor: klofberg,claude[bot],github-actions[bot]
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
