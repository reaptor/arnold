name: Release

# Every push to main builds the app for macOS (Apple silicon) and Windows (x64) and publishes it
# as a GitHub release. The version goes up with every commit: <major>.<minor> is taken from
# src-tauri/tauri.conf.json and the patch number is the number of commits on main.
# The release stays a draft until all builds have succeeded, so a failed build never leaves a
# half-filled public release behind.
#
# Installed copies update themselves from the newest release's latest.json (see
# src-tauri/src/updates.rs). The update packages are signed with the key in the
# TAURI_SIGNING_PRIVATE_KEY secret; its public half is `plugins.updater.pubkey` in tauri.conf.json.

on:
  push:
    branches:
      - main
    # The website (site/, deployed by site.yml) is not part of the app.
    paths-ignore:
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # <major>.<minor> from tauri.conf.json, patch = number of commits on main.
          base=$(jq -r .version src-tauri/tauri.conf.json | cut -d. -f1,2)
          version="$base.$(git rev-list --count HEAD)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$version" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Arnold $version" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows builds are signed through Azure Artifact Signing once the AZURE_CLIENT_SECRET
      # secret exists (see Signing.md). Until then they stay unsigned.
      # Switched off with `false &&` until the Azure identity validation is done; remove it to
      # turn signing back on.
      SIGN_WINDOWS: ${{ false && matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # Points Tauri's signCommand at SignTool with Microsoft's Artifact Signing dlib. Tauri then
      # signs Arnold.exe, the NSIS uninstaller and both installers, before it signs the update
      # packages. The dlib logs in with AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_CLIENT_SECRET
      # (passed to tauri-action below). The account details are repository variables.
      - name: Set up Windows code signing
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          foreach ($name in 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "The AZURE_$name repository variable is missing"
            }
          }

          $dir = Join-Path $env:RUNNER_TEMP artifact-signing
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.128 -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          $dlib = Join-Path $dir bin\x64\Azure.CodeSigning.Dlib.dll

          # The newest x64 SignTool from the Windows SDK, matching the x64 dlib.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'SignTool not found' }
          Write-Output "SignTool: $($signtool.FullName)"

          # Only the AZURE_* environment variables are used to log in, so a wrong secret fails
          # straight away instead of trying every other Azure login.
          $metadata = Join-Path $dir metadata.json
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY run $env:GITHUB_RUN_ID"
            ExcludeCredentials = @(
              'ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzureCliCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata

          # /d names the MSI in the UAC prompt; without it the prompt shows a random name.
          $file = 'src-tauri/tauri.windows.conf.json'
          $config = Get-Content $file -Raw | ConvertFrom-Json -AsHashtable
          $config.bundle.windows.signCommand = [ordered]@{
            cmd = $signtool.FullName
            args = @(
              'sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
              '/d', 'Arnold', '/dlib', $dlib, '/dmdf', $metadata, '%1'
            )
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content $file
          Get-Content $file

      # Also signs and uploads the update packages: Arnold.app.tar.gz on macOS, the installers
      # themselves on Windows, each with a .sig. latest.json is written once both builds are in
      # (publish-release), since two builds updating one file would race.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Only set when Windows signing is on, for SignTool's Artifact Signing dlib.
          AZURE_CLIENT_ID: ${{ env.SIGN_WINDOWS == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ env.SIGN_WINDOWS == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.SIGN_WINDOWS == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false

      # macOS gets a .pkg instead of a disk image, because only an installer can put the
      # `arnold` and `ace` commands on the PATH.
      - name: Build and upload the macOS installer
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          pkg="Arnold_${VERSION}_aarch64.pkg"
          src-tauri/installer/macos/build-pkg.sh \
            "target/${{ matrix.target }}/release/bundle/macos/Arnold.app" "$VERSION" "$pkg"
          gh api -X POST -H "Content-Type: application/octet-stream" --input "$pkg" --jq .browser_download_url \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$pkg"

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes list the commits since the previous release

      # What installed copies read to find this version: per platform, the package to download
      # and its signature. Points at the tag's download URLs, which work once it is published.
      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          set -euo pipefail
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" | jq -s add)
          named() {
            local name
            name=$(jq -r --arg suffix "$1" '[.[].name | select(endswith($suffix))][0] // empty' <<<"$assets")
            [ -n "$name" ] || { echo "No asset ending in $1" >&2; exit 1; }
            echo "$name"
          }
          package() {
            local id
            id=$(jq -r --arg name "$1.sig" '.[] | select(.name == $name) | .id' <<<"$assets")
            [ -n "$id" ] || { echo "No signature for $1" >&2; exit 1; }
            jq -n \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$1" \
              --arg signature "$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id")" \
              '{url: $url, signature: $signature}'
          }
          mac=$(package "$(named .app.tar.gz)")
          nsis=$(package "$(named -setup.exe)")
          msi=$(package "$(named .msi)")
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          notes=$(git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_SHA" | head -40)
          # The updater asks for <os>-<arch>-<installer> first, then <os>-<arch>: an .msi
          # installation updates with the .msi, a -setup.exe one with the -setup.exe.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac "$mac" --argjson nsis "$nsis" --argjson msi "$msi" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "darwin-aarch64": $mac, "darwin-aarch64-app": $mac,
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi}}' \
            > latest.json
          cat latest.json
          gh api -X POST -H "Content-Type: application/json" --input latest.json --jq .name \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release-id }}" -F draft=false --jq .html_url

  discard-release:
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release-id }}"
