name: Security review

# Claude reads every pull request for security problems, read-only, and sets
# the `security-review` commit status; findings on a claude/ branch go to the
# issue agent. Run it by hand on any PR with
# `gh workflow run security-review.yml -f pr=<number>`, which also ignores the
# round limit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

jobs:
  review:
    # Fork PRs get no secrets and are never reviewed or worked on.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: read
      id-token: write
    uses: reaptor/claude-agents/.github/workflows/security-review.yml@main
    with:
      pr: ${{ inputs.pr }}
      force: ${{ github.event_name == 'workflow_dispatch' }}
      instructions: .github/claude/arnold.md
      setup: .github/claude/setup.sh
      include-comments-by-actor: klofberg,claude[bot],github-actions[bot]
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
