name: Site

# Builds the arnoldapp.dev website (site/) into an httpd image on ghcr and tells the
# watchtower on the server to pull it. Runs only when the site or what it shows changes;
# release.yml in turn ignores site-only pushes, so they publish no app release.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - src-tauri/app-icon.svg
      - .github/workflows/site.yml
  workflow_dispatch:

# Spelled out rather than derived from github.repository: ghcr does not rename the
# package along with the repo. Keep in sync with site/docker-compose.yml and the
# docker:* scripts in site/package.json.
env:
  IMAGE: ghcr.io/reaptor/arnoldapp

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN authenticates against ghcr for this repo's own package,
      # so no long-lived registry credentials are stored here.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # The context is the repository root: the page imports the app's screenshots
      # and icon. site/Dockerfile.dockerignore trims the context to what it needs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      # Tell watchtower to pull what we just pushed instead of waiting out its
      # poll interval. ?image= takes the image WITHOUT a tag: watchtower compares
      # it with the container's image name minus its tag, so :latest matches
      # nothing and still answers 200.
      - name: Trigger deploy
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        run: |
          # 200 means watchtower accepted the request, not that a container matched.
          curl --fail --silent --show-error \
            --max-time 120 \
            -H "Authorization: Bearer $TOKEN" \
            "https://watchtower.reaptor.com/v1/update?image=${IMAGE}"
