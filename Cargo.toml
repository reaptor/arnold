[workspace]
resolver = "2"
members = ["src-tauri", "crates/arnold-ai", "crates/arnold-git", "crates/arnold-lsp", "crates/arnold-pr"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Certificates are checked by the operating system, so company roots installed
# there (TLS-inspecting proxies, an internal Azure DevOps Server) are trusted,
# as they are for git. On Windows the system proxy is used too.
ureq = { version = "3", features = ["gzip", "platform-verifier", "win-system-proxy"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
