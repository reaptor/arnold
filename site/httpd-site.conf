# Loaded after the stock httpd.conf (see Dockerfile).

LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so
LoadModule headers_module modules/mod_headers.so

AddOutputFilterByType DEFLATE text/html text/css text/plain text/javascript application/javascript image/svg+xml

# Astro puts a content hash in every file name under /_astro/, so those never change.
<Directory "/usr/local/apache2/htdocs/_astro">
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# The page itself must pick up a new deploy right away.
<Files "index.html">
    Header set Cache-Control "no-cache"
</Files>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# .dev is on the HSTS preload list, so browsers only ever come here over HTTPS anyway.
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

ServerTokens Prod
ServerSignature Off
