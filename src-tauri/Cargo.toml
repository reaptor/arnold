[package]
name = "arnold"
version.workspace = true
edition.workspace = true
description = "Commit, review and open pull requests for what AI agents wrote: git branches as a PR-style diff"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arnold-ai = { path = "../crates/arnold-ai" }
arnold-git = { path = "../crates/arnold-git" }
arnold-lsp = { path = "../crates/arnold-lsp" }
arnold-pr = { path = "../crates/arnold-pr" }
dunce = "1"
notify = "8"
notify-debouncer-full = "0.7"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
thiserror.workspace = true
tokio.workspace = true

# Notifications about pull requests, with a click on one reported back (the
# notification plugin of Tauri 2 does not report clicks on desktop).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
notify-rust = { version = "4.18", default-features = false }
